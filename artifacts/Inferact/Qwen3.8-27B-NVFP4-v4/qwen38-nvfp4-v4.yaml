# Source: https://recipes.vllm.ai/Qwen/Qwen3.8-27B?hardware=b200&advanced=gpu_mem_095%2Cmax_batched_8k%2Cmax_num_seqs_256%2Cmax_model_len_auto&variant=nvfp4
# note: requires vllm version qwen38 
host: "0.0.0.0"
port: "8000"
model: "Inferact/Qwen3.8-27B-NVFP4"
root-path: "/vllm"
tensor-parallel-size: 1
max-model-len: 65536
gpu-memory-utilization: 0.95
kv-cache-dtype: "fp8"
enable-prefix-caching: true
enable-chunked-prefill: true
max-num-batched-tokens: 16384
max-num-seqs: 256
enable-auto-tool-choice: true
tool-call-parser: "qwen3_xml"
reasoning-parser: "qwen3"
mm-encoder-tp-mode: "data"
async-scheduling: true
speculative-config.method: "mtp"
speculative-config.num_speculative_tokens: 3
